<!-- Sound Processing & Enhanced Features Logic -->
<script>
let activeSounds = [];

function playSound(file) {
const audio = new Audio(file);
activeSounds.push(audio);
audio.onended = function() {
activeSounds = activeSounds.filter(s => s !== audio);
};
audio.play().catch(err => console.log("Playback error: ", err));
}

function stopAllSounds() {
activeSounds.forEach(sound => {
sound.pause();
sound.currentTime = 0;
});
activeSounds = [];
}

// SEARCH FUNCTIONALITY
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const soundButtons = document.querySelectorAll('.sound-btn');

searchInput.addEventListener('input', (e) => {
const searchTerm = e.target.value.toLowerCase();

soundButtons.forEach(btn => {
const soundName = btn.dataset.name.toLowerCase();
if (soundName.includes(searchTerm)) {
btn.classList.remove('hidden');
} else {
btn.classList.add('hidden');
}
});
});

clearBtn.addEventListener('click', () => {
searchInput.value = '';
searchInput.focus();
soundButtons.forEach(btn => btn.classList.remove('hidden'));
});

// CHANGELOG MODAL
const changelogBtn = document.getElementById('changelogBtn');
const changelogModal = document.getElementById('changelogModal');
const closeChangelogBtn = document.getElementById('closeChangelogBtn');
const changelogList = document.getElementById('changelogList');

changelogBtn.addEventListener('click', fetchChangelog);
closeChangelogBtn.addEventListener('click', closeChangelog);
changelogModal.addEventListener('click', (e) => {
if (e.target === changelogModal) closeChangelog();
});

async function fetchChangelog() {
changelogList.innerHTML = '<p>Loading releases...</p>';
changelogModal.classList.add('active');

try {
const response = await fetch('https://api.github.com/repos/treatwashere/Memerz/releases');
const releases = await response.json();

if (releases.length === 0) {
changelogList.innerHTML = '<p>No releases yet. Check back soon!</p>';
return;
}

let html = '';
releases.forEach(release => {
const version = release.tag_name || release.name || 'Unknown';
const date = new Date(release.published_at).toLocaleDateString();
const body = release.body || 'No description available.';

html += `
<div class="release-item">
<div class="release-version">v${version}</div>
<div class="release-date">Released: ${date}</div>
<div class="release-body">${body.replace(/\n/g, '<br>')}</div>
</div>
`;
});

changelogList.innerHTML = html;
} catch (error) {
changelogList.innerHTML = '<p>Error loading changelog. Check back later!</p>';
console.error('Changelog fetch error:', error);
}
}

function closeChangelog() {
changelogModal.classList.remove('active');
}

/* --- FIXED FLUID TRANSFORMS DRAG LOGIC --- */
const toolbar = document.getElementById('floating-toolbar');
let isDragging = false;
let gestureMoved = false;
let startX = 0, startY = 0;
let transformX = 0, transformY = 0;
let dragStartX = 0, dragStartY = 0;

toolbar.addEventListener('pointerdown', (e) => {
isDragging = true;
gestureMoved = false;
dragStartX = e.clientX;
dragStartY = e.clientY;
startX = e.clientX - transformX;
startY = e.clientY - transformY;
toolbar.setPointerCapture(e.pointerId);
toolbar.style.transition = 'none';
});

toolbar.addEventListener('pointermove', (e) => {
if (!isDragging) return;

const totalDistance = Math.sqrt(Math.pow(e.clientX - dragStartX, 2) + Math.pow(e.clientY - dragStartY, 2));
if (totalDistance > 5) {
gestureMoved = true;
}

transformX = e.clientX - startX;
transformY = e.clientY - startY;

toolbar.style.transform = `translate(${transformX}px, ${transformY}px)`;
});

toolbar.addEventListener('pointerup', (e) => {
if (!isDragging) return;

isDragging = false;
toolbar.releasePointerCapture(e.pointerId);

toolbar.style.transition = 'transform 0.1s ease, border-color 0.2s';

if (!gestureMoved) {
stopAllSounds();
}
});

</script>
